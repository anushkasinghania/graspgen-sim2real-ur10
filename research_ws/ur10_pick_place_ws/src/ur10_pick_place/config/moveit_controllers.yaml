moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

# Allow 2× the planned trajectory duration before timing out.
# Required because the UR10 speed slider may be <100%, making execution
# slower than what MoveIt plans for (default scaling is only 1.1×).
trajectory_execution:
  allowed_execution_duration_scaling: 10.0
  allowed_goal_duration_margin: 30.0
  execution_duration_monitoring: true

moveit_simple_controller_manager:
  controller_names:
    - scaled_joint_trajectory_controller
    - gripper_trajectory_controller

  # scaled_joint_trajectory_controller is the default UR controller —
  # it respects the speed slider on the teach pendant.
  scaled_joint_trajectory_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint

  gripper_trajectory_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: false
    joints:
      - robotiq_finger_a_joint_1
      - robotiq_finger_b_joint_1
      - robotiq_finger_c_joint_1
