# OAK-D Pro Wide — Wrist (Eye-in-Hand Camera)
# Device MX ID: 14442C10715AD4D200  (fixed so this YAML always opens the wrist camera)
# Topic namespace: /wrist_cam/...
# Published: /wrist_cam/rgb/image_raw, /wrist_cam/depth/image_raw, /wrist_cam/rgb/camera_info
/wrist_cam/wrist_cam:
  ros__parameters:
    camera:
      i_mx_id: "14442C10715AD4D200"
      i_nn_type: none
      i_pipeline_type: RGBD
      i_enable_imu: false
      i_enable_ir: false
    rgb:
      i_resolution: "720"
      i_fps: 15.0
    stereo:
      i_resolution: "720"
      i_fps: 15.0
      i_align_depth: true
      i_subpixel: true
