hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - train.model_name=diffusion
    - data.root_dir=/home/ubuntu/GraspDataGen/graspgen_dataset/splits/robotiq_3f
    - data.object_root_dir=/home/ubuntu/GraspDataGen/objects/
    - data.grasp_root_dir=/home/ubuntu/GraspDataGen/graspgen_dataset/grasp_data/robotiq_3f/
    - data.gripper_name=robotiq_3f
    - data.dataset_version=v2
    - data.dataset_cls=ObjectPickDataset
    - data.cache_dir=/tmp/graspgen_cache/
    - diffusion.gripper_name=robotiq_3f
    - train.log_dir=/home/ubuntu/GraspDataGen/training_logs/robotiq_3f_gen/
    - train.num_epochs=500
  job:
    name: train_graspgen
    chdir: null
    override_dirname: data.cache_dir=/tmp/graspgen_cache/,data.dataset_cls=ObjectPickDataset,data.dataset_version=v2,data.grasp_root_dir=/home/ubuntu/GraspDataGen/graspgen_dataset/grasp_data/robotiq_3f/,data.gripper_name=robotiq_3f,data.object_root_dir=/home/ubuntu/GraspDataGen/objects/,data.root_dir=/home/ubuntu/GraspDataGen/graspgen_dataset/splits/robotiq_3f,diffusion.gripper_name=robotiq_3f,train.log_dir=/home/ubuntu/GraspDataGen/training_logs/robotiq_3f_gen/,train.model_name=diffusion,train.num_epochs=500
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/ubuntu/research_ws/GraspGen/scripts
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/ubuntu/research_ws/GraspGen/scripts
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/ubuntu/research_ws/GraspGen/scripts/outputs/2026-03-23/14-57-58
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
