hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - data.num_points=2048
    - data.dataset_cls=ObjectPickDataset
    - data.rotation_augmentation=True
    - data.root_dir=/home/ubuntu/GraspDataGen/graspgen_dataset/splits/robotiq_3f
    - data.object_root_dir=/home/ubuntu/GraspDataGen/objects
    - data.grasp_root_dir=/home/ubuntu/GraspDataGen/graspgen_dataset/grasp_data/robotiq_3f
    - data.dataset_name=objaverse
    - data.dataset_version=v2
    - data.prob_point_cloud=0.5
    - data.redundancy=3
    - data.gripper_name=robotiq_3f
    - data.cache_dir=/tmp/graspgen_cache
    - data.num_grasps_per_object=300
    - data.load_discriminator_dataset=False
    - train.log_dir=/home/ubuntu/GraspDataGen/training_logs/robotiq_3f_gen
    - train.batch_size=4
    - train.num_gpus=1
    - train.num_epochs=500
    - train.num_workers=2
    - train.print_freq=10
    - train.save_freq=100
    - train.model_name=diffusion
    - optimizer.type=ADAMW
    - optimizer.lr=0.00001
    - diffusion.gripper_name=robotiq_3f
    - diffusion.num_diffusion_iters=10
    - diffusion.num_diffusion_iters_eval=10
    - diffusion.obs_backbone=pointnet
    - diffusion.grasp_repr=r3_so3
    - diffusion.attention=cat_attn
    - diffusion.compositional_schedular=True
    - diffusion.pose_repr=mlp
    - diffusion.kappa=2.02217
  job:
    name: train_graspgen
    chdir: null
    override_dirname: data.cache_dir=/tmp/graspgen_cache,data.dataset_cls=ObjectPickDataset,data.dataset_name=objaverse,data.dataset_version=v2,data.grasp_root_dir=/home/ubuntu/GraspDataGen/graspgen_dataset/grasp_data/robotiq_3f,data.gripper_name=robotiq_3f,data.load_discriminator_dataset=False,data.num_grasps_per_object=300,data.num_points=2048,data.object_root_dir=/home/ubuntu/GraspDataGen/objects,data.prob_point_cloud=0.5,data.redundancy=3,data.root_dir=/home/ubuntu/GraspDataGen/graspgen_dataset/splits/robotiq_3f,data.rotation_augmentation=True,diffusion.attention=cat_attn,diffusion.compositional_schedular=True,diffusion.grasp_repr=r3_so3,diffusion.gripper_name=robotiq_3f,diffusion.kappa=2.02217,diffusion.num_diffusion_iters=10,diffusion.num_diffusion_iters_eval=10,diffusion.obs_backbone=pointnet,diffusion.pose_repr=mlp,optimizer.lr=0.00001,optimizer.type=ADAMW,train.batch_size=4,train.log_dir=/home/ubuntu/GraspDataGen/training_logs/robotiq_3f_gen,train.model_name=diffusion,train.num_epochs=500,train.num_gpus=1,train.num_workers=2,train.print_freq=10,train.save_freq=100
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/ubuntu/research_ws/GraspGen/scripts
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/ubuntu/research_ws/GraspGen/scripts
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/ubuntu/research_ws/GraspGen/scripts/outputs/2026-03-18/12-42-15
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
